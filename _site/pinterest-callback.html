<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pinterest OAuth Callback — WorthItGoods</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:600px;margin:4rem auto;padding:1rem;text-align:center;background:#f9fafb}h1{color:#111827}.code{background:#1f2937;color:#10b981;padding:1.2rem;border-radius:10px;font-family:monospace;font-size:1.1rem;word-break:break-all;margin:1.5rem 0;user-select:all}.note{color:#6b7280;font-size:.9rem;margin-top:2rem}</style></head><body>
<script>
(function(){
  const p = new URLSearchParams(window.location.search);
  const code = p.get('code');
  const error = p.get('error');
  const errDesc = p.get('error_description');
  
  if (error) { document.body.innerHTML = '<h1>❌ Authorization Failed</h1><p style="color:#c41e3a">'+error+'</p><p>'+ (errDesc||'') +'</p>'; return; }
  if (code) {
    document.body.innerHTML = '<h1>✅ Authorization Successful</h1><p>Copy the code below and share it with your assistant:</p><div class="code">'+code+'</div><p class="note">This page does not store any data. The code is a one-time use credential.</p>';
    // Also try to POST to local server if available
    try{ fetch('http://192.168.4.131:8080/callback?code='+encodeURIComponent(code)) }catch(e){}
    return;
  }
  document.body.innerHTML = '<h1>Pinterest OAuth Callback</h1><p>No authorization code received. This page expects a <code>?code=</code> parameter from Pinterest.</p>';
})();
</script></body></html>
